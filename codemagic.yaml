workflows:
  default-workflow:
    name: Build Gazeshop APK
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      python: 3.11
      vars:
        BASE_VERSION: "1.0"
    scripts:
      - name: Install dependencies & Flet
        script: |
          pip install --upgrade pip
          pip install flet==0.23.2 requests supabase
      - name: Build APK Flet dengan Versi Otomatis
        script: |
          BUILD_NUM=$BUILD_NUMBER
          VERSION_NAME="${BASE_VERSION}.${BUILD_NUM}"
          
          echo "Membuat APK untuk Versi: $VERSION_NAME (Build: $BUILD_NUM)"
          
          yes | flet build apk --product "Gazeshop" --org "com.gazeshop.app" --build-version "$VERSION_NAME" --build-number "$BUILD_NUM"
    artifacts:
      - build/apk/*.apk
