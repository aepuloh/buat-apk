workflows:
  default-workflow:
    name: Build Gazeshop APK
    instance_type: mac_mini_m1
    environment:
      # Kunci versi Flutter di 3.22.2 agar sama persis dengan GitHub Actions dan kompatibel dengan Flet 0.23.2
      flutter: 3.22.2
      vars:
        BASE_VERSION: "1.0"
    scripts:
      - name: Install dependencies & Flet
        script: |
          pip install --upgrade pip
          pip install flet==0.23.2
          # Catatan: requests dan supabase tidak perlu di-install di mesin Codemagic, 
          # Flet akan otomatis mengambilnya dari file requirements.txt ke dalam APK
      - name: Build APK Flet dengan Versi Otomatis
        script: |
          BUILD_NUM=$BUILD_NUMBER
          VERSION_NAME="${BASE_VERSION}.${BUILD_NUM}"
          
          echo "Membuat APK untuk Versi: $VERSION_NAME (Build: $BUILD_NUM)"
          
          # Tambahkan flag -vv agar jika terjadi error, log spesifiknya langsung terlihat
          yes | flet build apk -vv --product "Gazeshop" --org "com.gazeshop.app" --build-version "$VERSION_NAME" --build-number "$BUILD_NUM"
    artifacts:
      # Gunakan ** untuk memastikan Codemagic mencari ke dalam sub-folder jika lokasi build berubah
      - build/apk/**/*.apk
