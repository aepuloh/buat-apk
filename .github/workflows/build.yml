name: Build Android APK (Flet)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Diperlukan oleh Flutter & Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter (Kunci Versi 3.22.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flet (Versi Stabil)
        run: pip install flet==0.23.2

      - name: Build APK dengan Mode Verbose (-vv)
        run: |
          flet build apk -vv \
            --product "Gazeshop" \
            --org "com.gazeshop.app" \
            --build-version "1.0.${{ github.run_number }}" \
            --build-number ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gazeshop-APK
          path: build/apk/**/*.apk
