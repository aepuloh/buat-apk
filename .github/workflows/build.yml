name: Build Android APK (Flet)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Kita matikan setup flutter bawaan agar Flet bebas mengunduh versinya sendiri
      # - name: Setup Flutter
      #   uses: subosito/flutter-action@v2
      #   with:
      #     channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Build APK (Auto-yes)
        # yes | akan otomatis menjawab "y" saat flet meminta izin install Flutter SDK
        run: yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Flet-APK
          path: build/apk/**/*.apk
