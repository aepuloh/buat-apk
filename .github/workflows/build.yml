name: Build Android APK (Flet Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Java (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Baris cache gradle dihapus agar tidak error mencari file gradle yang belum ada

      - name: Setup Flutter (Kunci Versi 3.22.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install Flet (Versi Stabil)
        run: |
          pip install --upgrade pip
          pip install flet==0.23.2 requests supabase

      - name: Build APK dengan Versi Otomatis
        run: |
          # Menggunakan printf 'y\n' agar tidak terjadi error broken pipe seperti pakai 'yes |'
          printf 'y\n' | flet build apk --product "Gazeshop" --org "com.gazeshop.app" --build-version "1.0.${{ github.run_number }}" --build-number ${{ github.run_number }}

      - name: Build APK dengan Versi Otomatis
        run: |
          yes | flet build apk --product "Gazeshop" --org "com.gazeshop.app" --build-version "1.0.${{ github.run_number }}" --build-number ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gazeshop-APK
          path: build/apk/**/*.apk
