name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config dos2unix
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "virtualenv==20.26.2" buildozer

      - name: Fix Buildozer Spec
        run: |
          dos2unix buildozer.spec
          
          # Lisensi SDK
          sed -i 's/^#android.accept_sdk_license.*/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/g' buildozer.spec
          
          # Kembalikan requirements ke default tanpa dikunci (Saran Copilot)
          sed -i 's/^#requirements =.*/requirements = python3,kivy/g' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy/g' buildozer.spec
          
          # API dan NDK sesuai saran Copilot
          sed -i 's/^android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/^#android.api =.*/android.api = 33/g' buildozer.spec
          sed -i 's/^android.minapi =.*/android.minapi = 24/g' buildozer.spec
          sed -i 's/^#android.minapi =.*/android.minapi = 24/g' buildozer.spec
          sed -i 's/^android.ndk =.*/android.ndk = 25b/g' buildozer.spec
          sed -i 's/^#android.ndk =.*/android.ndk = 25b/g' buildozer.spec

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-Cyber-APK
          path: bin/*.apk
