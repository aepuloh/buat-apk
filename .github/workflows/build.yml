name: Build Android APK (Flet)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet (Versi Stabil)
        # Kunci Flet di versi stabil agar tidak ada bug AttributeError
        run: pip install flet==0.23.2

      - name: Build APK (Auto-yes)
        run: yes | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Flet-APK
          path: build/apk/**/*.apk
