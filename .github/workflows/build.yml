name: Build Android APK (Flet)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter (Kunci Versi 3.22.2)
        uses: subosito/flutter-action@v2
        with:
          # Kunci Flutter di versi ini agar sejajar dengan Flet 0.23.2 dan tidak menuntut Gradle baru
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Flet (Versi Stabil)
        run: pip install flet==0.23.2

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Flet-APK
          path: build/apk/**/*.apk
