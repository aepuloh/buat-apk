name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config
          
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "Cython<3.0.0" buildozer virtualenv

      - name: Fix Buildozer Spec & Requirements
        run: |
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec

      - name: First Build Pass (To download SDK)
        run: |
          buildozer -v android debug || true

      - name: Force Accept All Android SDK Licenses
        run: |
          ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
          if [ -d "$ANDROID_HOME" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          fi

      - name: Final Build APK (Second Pass)
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-Cyber-APK
          path: bin/*.apk
